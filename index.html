<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>洛伊｜機械工程配置編輯器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%2313161c'/%3E%3Cpath d='M14 18h36v28H14z' fill='none' stroke='%23f2b84b' stroke-width='5'/%3E%3Cpath d='M26 18v28M38 18v28M14 30h36' stroke='%23f2b84b' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260918-4">
  <link rel="stylesheet" href="icon-fix.css?v=20260918-4">
</head>
<body>
  <header><div><h1>機械工程配置編輯器</h1><p>拖曳配置・增幅範圍・連接加乘・一鍵優化</p></div><div class="actions"><button id="saveBtn">匯出配置</button><label class="button">匯入配置<input id="importFile" type="file" accept=".json"></label><button id="resetBtn" class="danger">重設</button></div></header>
  <main>
    <aside class="palette panel"><h2>零件庫</h2><div id="filters" class="filters"></div><div id="palette"></div></aside>
    <section class="workspace">
      <div class="toolbar panel"><label>優化流派 <select id="build"><option value="attack">攻擊</option><option value="defense">防禦</option><option value="support">輔助</option><option value="weaken">弱化</option><option value="balanced">均衡</option></select></label><label>搜尋強度 <select id="rounds"><option value="2500">快速</option><option value="10000" selected>標準</option><option value="30000">深入</option></select></label><label class="strict-toggle"><input id="strictConnected" type="checkbox" checked> 同類必須連成一組</label><button id="optimizeBtn" class="primary">一鍵優化</button><button id="clearBtn">清空未鎖定</button><span id="status"></span></div>
      <div class="board-wrap panel"><div id="board" class="board" aria-label="5乘5配置盤"></div><div class="legend"><span class="attack">攻擊</span><span class="defense">防禦</span><span class="support">輔助</span><span class="weaken">弱化</span><span class="amp">增幅</span></div></div>
      <div id="summary" class="summary"></div>
    </section>
    <aside class="editor panel"><h2>格子設定</h2><div id="editor"><p class="muted">點選格子查看與修改。</p></div></aside>
  </main>
  <section class="details panel"><div class="details-head"><h2>最大能力明細</h2><span>截圖區間最大值 × 同類連接倍率</span></div><div class="table-wrap"><table><thead><tr><th>位置</th><th>零件</th><th>類型</th><th>自身</th><th>增幅後</th><th>增幅來源</th><th>連接</th><th>倍率</th><th>區間最大值</th><th>最終最大值</th></tr></thead><tbody id="calcBody"></tbody></table></div></section>
  <script src="connectivity.js?v=20260918-4"></script>
  <script src="effect-engine.js?v=20260918-4"></script>
  <script src="app.js?v=20260918-4"></script>
</body></html>
